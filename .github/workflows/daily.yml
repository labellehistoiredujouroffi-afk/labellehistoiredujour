name: Préparation quotidienne
on:
  schedule:
    - cron: "0 15 * * *"   # 16:00 (hiver) / 17:00 (été) à Paris — avant la publication Make de 18:30
  workflow_dispatch:
    inputs:
      date: { description: "Date AAAA-MM-JJ (vide = aujourd'hui)", required: false }
      test: { description: "Mode test (ignore l'interrupteur Paramètres)", type: boolean, default: false }
concurrency: { group: daily, cancel-in-progress: false }   # jamais deux préparations simultanées
permissions: { contents: write }
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
      PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      DATE: ${{ inputs.date }}
      TEST: ${{ inputs.test && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: node src/daily.mjs prepare
      - name: Publier les images sur GitHub Pages
        run: |
          git config user.name "belle-histoire-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/posts && (git diff --cached --quiet || (git commit -m "Visuels du $(date +%F)" && git push))
      - run: node src/daily.mjs notify
