name: Reels automatiques
on:
  schedule:
    - cron: "15 18 * * 2,4,6"   # mardi, jeudi, samedi à 19:15 (hiver) / 20:15 (été) à Paris
  workflow_dispatch:
    inputs:
      force: { description: "Forcer même si les reels sont désactivés (reels/config.json) — PUBLIE RÉELLEMENT un reel", type: boolean, default: false }
concurrency: { group: reels, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: "17841477131718128"
      PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      FORCE: ${{ inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - run: npm ci && npx playwright install --with-deps chromium
      - run: node src/reel.mjs render
      - name: Mettre la vidéo en ligne (GitHub Pages)
        run: |
          git config user.name "belle-histoire-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/reels && (git diff --cached --quiet || (git commit -m "Reel du $(date +%F)" && git pull --rebase -q && git push))
      - run: node src/reel.mjs publish
      - name: Enregistrer le reel publié (pas de doublon)
        if: always()
        run: |
          git add reels/log.json && (git diff --cached --quiet || (git commit -m "Journal des reels" && git pull --rebase -q && git push))
