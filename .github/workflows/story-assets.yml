name: Régénérer les visuels de stories
on:
  workflow_dispatch:
  push: { paths: ["stories/catalog.json", "templates/story.html", "templates/brand.css"] }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npx playwright install --with-deps chromium
      - run: node src/render-stories.mjs docs/stories
      - run: |
          git config user.name "belle-histoire-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/stories && (git diff --cached --quiet || (git commit -m "Stories régénérées" && git push))
