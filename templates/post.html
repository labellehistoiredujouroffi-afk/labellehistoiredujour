<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>La Belle Histoire du Jour — moteur de slides</title>
<link rel="stylesheet" href="brand.css">
<style>
  body { margin: 0; background: #ddd; }
  #stage.measuring .text, #stage.measuring .body { justify-content: flex-start !important; }
  #stage { display: flex; flex-direction: column; gap: 40px; padding: 0; }

  .slide {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font-family: var(--f-body); box-sizing: border-box;
  }
  .grain::after { /* subtle paper texture, deterministic */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(42,37,48,.035) 1px, transparent 1px);
    background-size: 7px 7px;
  }

  /* ---------- shared header / footer ---------- */
  .brandbar { position: absolute; top: 72px; left: 96px; right: 96px;
    display: flex; align-items: center; gap: 18px; z-index: 2; }
  .brandbar .mark { width: 58px; height: 58px; flex: none; }
  .brandbar .name { font-family: var(--f-ui); font-weight: 600; font-size: 22px;
    letter-spacing: .22em; text-transform: uppercase; color: var(--ink); }
  .brandbar .count { margin-left: auto; font-family: var(--f-ui); font-size: 22px;
    color: var(--muted); letter-spacing: .08em; }

  .foot { position: absolute; left: 96px; right: 96px; bottom: 72px;
    display: flex; align-items: center; gap: 18px; font-family: var(--f-ui);
    font-size: 22px; color: var(--muted); z-index: 2; }
  .foot .dots { display: flex; gap: 10px; margin-left: auto; }
  .foot .dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
  .foot .dots i.on { background: var(--sun); width: 34px; border-radius: 6px; }

  .badge { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px;
    border-radius: 999px; border: 2px solid var(--ink); font-family: var(--f-ui);
    font-weight: 600; font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
  .badge.fiction { border-color: var(--plum); color: var(--plum); }
  .badge.real { border-color: var(--sun-deep); color: var(--sun-deep); }
  .badge svg { width: 22px; height: 22px; }

  /* ---------- cover ---------- */
  .cover .sun { position: absolute; width: 920px; height: 920px; right: -300px; top: -260px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 60%, var(--sun-soft) 0%, var(--sun-glow) 55%, rgba(251,245,236,0) 70%); }
  .cover .rays { position: absolute; right: 70px; top: 230px; width: 300px; height: 300px; opacity: .9; }
  .cover .body { position: absolute; left: 96px; right: 96px; top: 470px; bottom: 260px;
    display: flex; flex-direction: column; justify-content: center; }
  .cover .kicker { font-family: var(--f-hand); font-weight: 600; font-size: 64px;
    color: var(--sun-deep); margin-bottom: 18px; line-height: 1; }
  .cover h1 { font-family: var(--f-title); font-weight: 600; margin: 0; line-height: 1.04;
    letter-spacing: -0.015em; font-size: 112px; color: var(--ink); text-wrap: balance; }
  .cover .rule { width: 140px; height: 8px; background: var(--sun); border-radius: 4px; margin-top: 48px; }
  .cover .swipe { font-family: var(--f-ui); font-weight: 600; font-size: 24px; color: var(--ink);
    letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; gap: 12px; }

  /* ---------- narration ---------- */
  .narr .ttl { position: absolute; top: 158px; left: 96px; right: 96px; font-family: var(--f-title);
    font-style: italic; font-size: 30px; color: var(--muted); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; padding-bottom: 26px; border-bottom: 2px solid var(--line); }
  .narr .text { position: absolute; left: 96px; right: 96px; top: 260px; bottom: 190px;
    display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .narr p { font-family: var(--f-body); font-weight: 400; margin: 0 0 .8em 0; line-height: 1.5;
    color: var(--ink); hyphens: manual; text-align: left; }
  .narr p:last-child { margin-bottom: 0; }
  .narr p.finmark, .single .finmark { font-family: var(--f-title); font-style: italic; font-weight: 600; color: var(--sun-deep); text-align: right; font-size: 1.15em; margin-top: .6em; }
  .single .finmark { font-size: 48px; margin: 10px 0 0; }
  .narr p.first::first-letter { font-family: var(--f-title); font-weight: 600; color: var(--sun-deep);
    float: left; font-size: 3.1em; line-height: .86; padding: .06em .1em 0 0; }
  .narr .cont { font-family: var(--f-ui); font-size: 22px; color: var(--sun-deep); font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase; }

  /* ---------- single (story fits on one image) ---------- */
  .single .sun { position: absolute; width: 640px; height: 640px; right: -260px; top: -260px; border-radius: 50%;
    background: radial-gradient(circle, var(--sun-soft) 0%, var(--sun-glow) 55%, rgba(251,245,236,0) 70%); }
  .single .body { position: absolute; left: 96px; right: 96px; top: 190px; bottom: 170px;
    display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  .single .kicker { font-family: var(--f-hand); font-weight: 600; font-size: 50px; color: var(--sun-deep); line-height: 1; margin-bottom: 10px; }
  .single h1 { font-family: var(--f-title); font-weight: 600; margin: 0 0 36px; line-height: 1.06; font-size: 72px; text-wrap: balance; }
  .single p { font-family: var(--f-body); margin: 0 0 .7em; line-height: 1.48; }
  .single p.first::first-letter { font-family: var(--f-title); font-weight: 600; color: var(--sun-deep);
    float: left; font-size: 3.1em; line-height: .86; padding: .06em .1em 0 0; }
  .single .cta { margin-top: 30px; font-family: var(--f-hand); font-size: 44px; color: var(--plum); line-height: 1.1; }

  /* ---------- conclusion ---------- */
  .end { background: linear-gradient(160deg, var(--sun) 0%, var(--sun-deep) 100%); color: var(--paper); }
  .end .brandbar .name, .end .brandbar .count { color: var(--paper); }
  .end .mark path { fill: var(--paper); } .end .mark line, .end .mark g { stroke: var(--paper) !important; }
  .end .halo { position: absolute; width: 1100px; height: 1100px; left: -420px; bottom: -560px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,236,214,.55) 0%, rgba(255,236,214,0) 65%); }
  .end .body { position: absolute; left: 96px; right: 96px; top: 230px; bottom: 210px;
    display: flex; flex-direction: column; justify-content: center; }
  .end .fin { font-family: var(--f-title); font-style: italic; font-size: 64px; opacity: .9; margin-bottom: 40px; }
  .end .closing { font-family: var(--f-body); font-style: italic; font-size: 40px; line-height: 1.45; margin: 0 0 56px; opacity: .95; }
  .end h2 { font-family: var(--f-title); font-weight: 600; font-size: 84px; line-height: 1.05; margin: 0 0 34px; text-wrap: balance; }
  .end .how { font-family: var(--f-ui); font-size: 32px; line-height: 1.45; margin: 0; max-width: 820px; }
  .end .how b { font-weight: 600; }
  .end .credit:empty { display: none; }
  .end .credit { position: absolute; left: 96px; right: 96px; bottom: 72px; font-family: var(--f-ui);
    font-size: 23px; line-height: 1.4; opacity: .92; padding-top: 24px; border-top: 2px solid rgba(251,245,236,.4); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="engine.js"></script>
</body>
</html>
